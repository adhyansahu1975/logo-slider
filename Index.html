<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Partners Logo Slider</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,300&family=Playfair+Display:wght@500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafaf8;
      --surface: #ffffff;
      --border: #e8e6e1;
      --border-hover: #c8c4bc;
      --text: #1a1a18;
      --text-muted: #9a9690;
      --accent: #2a6b4f;
      --speed: 32s;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
      --shadow-hover: 0 4px 12px rgba(0,0,0,0.1), 0 16px 40px rgba(0,0,0,0.06);
    }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .partners-section { width: 100%; padding: 80px 0; }

    .section-header { text-align: center; margin-bottom: 56px; padding: 0 24px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }
    .eyebrow::before, .eyebrow::after {
      content: '';
      width: 28px;
      height: 1px;
      background: var(--accent);
      opacity: 0.5;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 500;
      color: var(--text);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .section-sub {
      margin-top: 12px;
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 300;
      font-style: italic;
    }

    .slider-track-wrapper {
      width: 100%;
      overflow: hidden;
      position: relative;
      padding: 8px 0;
    }
    .slider-track-wrapper::before,
    .slider-track-wrapper::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 160px;
      z-index: 2;
      pointer-events: none;
    }
    .slider-track-wrapper::before {
      left: 0;
      background: linear-gradient(to right, var(--bg) 0%, transparent 100%);
    }
    .slider-track-wrapper::after {
      right: 0;
      background: linear-gradient(to left, var(--bg) 0%, transparent 100%);
    }

    .slider-track {
      display: flex;
      width: max-content;
      animation: marquee var(--speed) linear infinite;
    }
    .slider-track:hover { animation-play-state: paused; }

    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .logo-card {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 10px;
      padding: 18px 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      min-width: 200px;
      height: 88px;
      cursor: pointer;
      position: relative;
      box-shadow: var(--shadow);
      transition: box-shadow 0.35s ease, border-color 0.35s ease, transform 0.35s ease;
    }
    .logo-card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.9), transparent);
    }
    .logo-card:hover {
      box-shadow: var(--shadow-hover);
      border-color: var(--border-hover);
      transform: translateY(-4px);
    }

    .logo-inner {
      display: flex;
      align-items: center;
      gap: 11px;
      opacity: 0.42;
      filter: grayscale(1);
      transition: opacity 0.35s ease, filter 0.35s ease;
    }
    .logo-card:hover .logo-inner { opacity: 1; filter: grayscale(0); }

    .logo-icon { width: 30px; height: 30px; flex-shrink: 0; }

    .logo-name {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
      color: var(--text);
    }

    .row-gap { height: 14px; }

    .stats-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      margin-top: 56px;
      padding: 28px 48px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      width: 100%;
      background: var(--surface);
    }

    .stat { text-align: center; }
    .stat-number {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 5px;
    }
    .stat-divider { width: 1px; height: 36px; background: var(--border); }

    .edit-note {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      padding: 24px;
      letter-spacing: 0.03em;
    }
    .edit-note code {
      background: #f0eeea;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      color: var(--accent);
    }

    @media (max-width: 600px) {
      .stats-strip { gap: 24px; padding: 24px; flex-wrap: wrap; }
      .stat-divider { display: none; }
    }
  </style>
</head>
<body>

<section class="partners-section">
  <div class="section-header">
    <div class="eyebrow">Our Partners</div>
    <h2 class="section-title">Trusted by industry leaders</h2>
    <p class="section-sub">Proudly collaborating with world-class brands</p>
  </div>

  <div class="slider-track-wrapper">
    <div class="slider-track" id="row1"></div>
  </div>

  <div class="row-gap"></div>

  <div class="slider-track-wrapper">
    <div class="slider-track" id="row2" style="animation-duration:42s; animation-delay:-8s;"></div>
  </div>

  <div class="stats-strip">
    <div class="stat">
      <div class="stat-number">120+</div>
      <div class="stat-label">Partners</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-number">40+</div>
      <div class="stat-label">Countries</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-number">98%</div>
      <div class="stat-label">Satisfaction</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-number">8yr</div>
      <div class="stat-label">Avg. Partnership</div>
    </div>
  </div>
</section>

<p class="edit-note">
  Edit the <code>logos1</code> &amp; <code>logos2</code> arrays · swap <code>svg</code> for <code>imgUrl: "https://..."</code> to use real logo images
</p>

  function buildCard({ name, color, svg, imgUrl }) {
    const card = document.createElement('div');
    card.className = 'logo-card';
    card.title = name;
    let inner = '';
    if (imgUrl) {
      inner = `<img src="${imgUrl}" alt="${name}" style="height:34px;max-width:130px;object-fit:contain;" />`;
    } else {
      const svgBody = svg.replace(/<svg[^>]*>/i, '').replace(/<\/svg>/i, '');
      inner = `<svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor" style="color:${color}">${svgBody}</svg><span class="logo-name">${name}</span>`;
    }
    card.innerHTML = `<div class="logo-inner">${inner}</div>`;
    return card;
  }

  function populateRow(id, data) {
    const row = document.getElementById(id);
    [...data, ...data].forEach(logo => row.appendChild(buildCard(logo)));
  }

  populateRow('row1', logos1);
  populateRow('row2', logos2);
</script>

</html>
